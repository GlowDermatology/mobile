name: glow_derma
description: "Glow Derma customer app (iOS and Android): catalog, cart, Click/Payme checkout, orders, cashback QR, appointments and notifications."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  app_links: ^7.2.2
  cached_network_image: ^4.0.6
  clock: ^1.1.3
  device_info_plus: ^13.3.0
  dio: ^5.11.1
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  flutter:
    sdk: flutter
  flutter_local_notifications: ^23.0.0
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  flutter_secure_storage: ^11.2.0
  flutter_windowmanager_plus: ^1.1.1
  go_router: ^18.1.4
  intl: ^0.20.3
  package_info_plus: ^10.2.2
  qr_flutter: ^4.1.0
  screen_brightness: ^2.1.11
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5
  fake_async: ^1.3.3

flutter:
  uses-material-design: true
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope.ttf
    - family: CormorantGaramond
      fonts:
        - asset: assets/fonts/CormorantGaramond.ttf
